<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quigimer</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#1a1033;color:#f4ecff;font-family:VT323,monospace;font-size:24px;line-height:1.3;background-image:linear-gradient(transparent 50%,rgba(0,0,0,.18) 50%);background-size:100% 4px}
nav{display:flex;justify-content:space-between;padding:22px 56px;font-size:22px}
.logo{font-family:'Press Start 2P',monospace;font-size:18px;color:#ffd23f}
.hero{padding:40px 56px 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.tag{display:inline-block;background:#ff4f8b;color:#1a1033;padding:4px 12px;font-size:20px}
h1{font-family:'Press Start 2P',monospace;font-size:40px;line-height:1.35;margin:20px 0;color:#fff}
h1 span{color:#3df5c8}
.hero p{max-width:540px;color:#cdbfee}
form{display:flex;margin-top:26px;max-width:540px}
input{flex:1;background:#0d0820;border:3px solid #3df5c8;color:#fff;font:inherit;padding:12px}
button{background:#ffd23f;border:3px solid #ffd23f;font-family:'Press Start 2P';font-size:12px;padding:0 20px;color:#1a1033;box-shadow:4px 4px 0 #ff4f8b}
.screen{border:6px solid #ffd23f;background:#0d0820;height:360px;position:relative;box-shadow:10px 10px 0 #ff4f8b;overflow:hidden}
.screen i{position:absolute;background:#3df5c8;width:28px;height:28px}
.screen .p{left:60px;bottom:60px;background:#ffd23f;width:40px;height:40px}
.screen .g{bottom:0;left:0;right:0;height:60px;background:repeating-linear-gradient(90deg,#8a4fff 0 40px,#6a35d6 40px 80px)}
.stats{display:flex;gap:0;margin:20px 56px 0;border:3px solid #3df5c8}
.stats div{flex:1;padding:14px 20px;border-right:3px solid #3df5c8}.stats div:last-child{border:0}
.stats b{font-family:'Press Start 2P';font-size:22px;color:#ffd23f;display:block}
</style></head><body>
<nav><span class="logo">QUIGIMER</span><span>GAMES &nbsp; NEWS &nbsp; ABOUT</span></nav>
<section class="hero"><div><span class="tag">SEED ROUND CLOSED</span><h1>Games for <span>healthy</span> habits, in 8 bits.</h1><p>Quigimer makes short, pixel-art games you can play between meetings. Ten minutes, no doomscroll, and a stretch break built into every level.</p>
<form><input placeholder="you@work.com"><button type="button">JOIN</button></form></div>
<div class="screen"><i style="left:240px;top:80px"></i><i style="left:280px;top:120px;background:#ff4f8b"></i><i class="p"></i><div class="g"></div></div></section>
<div class="stats"><div><b>$3.2M</b>seed raised</div><div><b>11</b>tiny games</div><div><b>48K</b>daily players</div><div><b>9 min</b>avg session</div></div>
</body></html>
