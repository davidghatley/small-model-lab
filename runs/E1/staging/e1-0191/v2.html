<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quigimer</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#f6e9c8;color:#2b1d12;font-family:'Space Mono',monospace;line-height:1.5}
nav{display:flex;justify-content:space-between;align-items:center;padding:26px 64px;border-bottom:3px solid #2b1d12}
.logo{font-family:Rubik;font-weight:900;font-size:30px;letter-spacing:-1px}
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:560px}
.l{padding:60px 64px}
.l h1{font-family:Rubik;font-weight:900;font-size:78px;line-height:.95;letter-spacing:-3px}
.l h1 u{text-decoration:none;color:#e0562b}
.l p{margin:24px 0;font-size:17px;max-width:480px}
.row{display:flex;gap:0}
.row input{flex:1;padding:16px;border:3px solid #2b1d12;background:#fff8e4;font:inherit}
.row b{background:#2b1d12;color:#f6e9c8;padding:16px 24px;font-family:Rubik}
.r{background:#e0562b;border-left:3px solid #2b1d12;display:grid;place-items:center;position:relative;overflow:hidden}
.r .sun{width:300px;height:300px;border-radius:50%;background:repeating-linear-gradient(#f6c344 0 24px,#e88a2b 24px 32px)}
.r .bar{position:absolute;bottom:0;left:0;right:0;display:flex;background:#2b1d12;color:#f6e9c8;font-family:Rubik}
.bar div{flex:1;padding:14px 20px}.bar strong{display:block;font-size:28px;color:#f6c344}
</style></head><body>
<nav><span class="logo">quigimer</span><span>games / news / hello</span></nav>
<section class="hero"><div class="l"><h1>Play like it's <u>1994.</u> Feel like it's today.</h1><p>An indie studio, freshly seed-funded, building cozy cartridge-style games with built-in breaks. Made for people who sit all day and want to move.</p><div class="row"><input placeholder="Email for the newsletter"><b>Sign up</b></div></div>
<div class="r"><div class="sun"></div><div class="bar"><div><strong>$3.2M</strong>seed</div><div><strong>11</strong>games</div><div><strong>48K</strong>players</div></div></div></section>
</body></html>
